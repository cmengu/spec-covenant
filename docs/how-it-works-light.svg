<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" width="800" height="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>The validator runs four checks in order on a spec file.</title>
<line x1="20" y1="80" x2="780" y2="80" stroke="#1f4fd8" stroke-width="8" stroke-linecap="round"/>
<text x="20" y="50" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">spec.yaml</text>
<text x="210" y="50" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">1  safe_load</text>
<text x="210" y="112" font-size="13" fill="#59636e" text-anchor="middle">file is a mapping</text>
<line x1="210" y1="60" x2="210" y2="100" stroke="#1f2328" stroke-width="2"/>
<text x="380" y="50" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">2  schema</text>
<text x="380" y="112" font-size="13" fill="#59636e" text-anchor="middle">9 fields, no extras</text>
<line x1="380" y1="60" x2="380" y2="100" stroke="#1f2328" stroke-width="2"/>
<text x="550" y="50" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">3  goal</text>
<text x="550" y="112" font-size="13" fill="#59636e" text-anchor="middle">20 words or fewer</text>
<line x1="550" y1="60" x2="550" y2="100" stroke="#1f2328" stroke-width="2"/>
<text x="710" y="50" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">4  test_cases</text>
<text x="710" y="112" font-size="13" fill="#59636e" text-anchor="middle">1 passing, 1 failing</text>
<line x1="710" y1="60" x2="710" y2="100" stroke="#1f2328" stroke-width="2"/>
<text x="20" y="152" font-size="13" fill="#59636e">A failed check raises ValueError at that step. The CLI prints it and exits 1; later checks do not run.</text>
<text x="20" y="172" font-size="13" fill="#59636e">If all four pass, the parsed spec is returned.</text>
</svg>
